name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches csproj version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/WysiMd.Blazor/WysiMd.Blazor.csproj)
          echo "Tag version:    $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION does not match <Version>$CSPROJ_VERSION</Version> in csproj."
            exit 1
          fi

      - name: Validate CHANGELOG is updated
        run: |
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/WysiMd.Blazor/WysiMd.Blazor.csproj)
          echo "Checking CHANGELOG for version $CSPROJ_VERSION..."
          if grep -q "## \[$CSPROJ_VERSION\]" CHANGELOG.md; then
            echo "✓ CHANGELOG is up-to-date with version $CSPROJ_VERSION"
          else
            echo "ERROR: CHANGELOG.md is missing an entry for version $CSPROJ_VERSION"
            echo "Please add a section like: ## [$CSPROJ_VERSION] – $(date +%Y-%m-%d)"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
